<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WORLDCUPWATCHER</title>
  <meta name="description" content="Find the best places to watch the 2026 World Cup across the UK. Free screenings, fan zones, pubs and more.">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%9A%BD</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Team Selection Overlay -->
  <div id="team-select-overlay" class="overlay">
    <div class="overlay-inner">
      <div class="overlay-logo">
        <span class="logo-world">WORLD</span><span class="logo-cup">CUP</span><span class="logo-watcher">WATCHER</span>
      </div>
      <p class="overlay-subtitle">FIND YOUR SCREEN.<br>PICK YOUR TEAM.<br>UK 2026.</p>
      <div class="team-search-wrap">
        <input type="text" id="team-search" placeholder="Search your country..." autocomplete="off">
      </div>
      <div id="team-grid" class="team-grid"></div>
      <button id="skip-team" class="skip-btn">SKIP FOR NOW</button>
    </div>
  </div>

  <!-- Share Modal -->
  <div id="share-modal" class="modal" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <button class="modal-close" aria-label="Close">&times;</button>
      <h3>SHARE THIS EVENT</h3>
      <div class="share-buttons">
        <button class="share-btn" data-platform="whatsapp">WhatsApp</button>
        <button class="share-btn" data-platform="twitter">X / Twitter</button>
        <button class="share-btn" data-platform="telegram">Telegram</button>
        <button class="share-btn" data-platform="copy">Copy Link</button>
      </div>
      <p id="copy-confirm" class="copy-confirm" hidden>Link copied!</p>
    </div>
  </div>

  <!-- Main App -->
  <header class="top-bar">
    <div class="top-bar-inner">
      <div class="logo-mark">
        <span class="logo-world">W</span><span class="logo-cup">C</span><span class="logo-watcher">W</span>
      </div>
      <button id="btn-team-change" class="team-badge" aria-label="Change team">
        <span id="current-team-flag"></span>
      </button>
    </div>
  </header>

  <!-- Content Area -->
  <main id="content-area" class="content-area">
    <!-- Match Header (shows current/next match for favourite team) -->
    <div id="match-highlight" class="match-highlight" hidden>
      <div class="match-highlight-inner">
        <span class="match-label">NEXT MATCH</span>
        <div class="match-teams">
          <span id="hl-team-a"></span>
          <span class="match-vs">VS</span>
          <span id="hl-team-b"></span>
        </div>
        <span id="hl-match-time" class="match-time"></span>
      </div>
    </div>
    <!-- Sticky sub-header (rendered by JS per tab) -->
    <div id="sub-header" class="sub-header">
      <h2 id="sub-title" class="sub-title">UPCOMING</h2>
      <div id="sub-controls" class="sub-controls">
        <select id="city-select" class="city-select">
          <option value="london">London</option>
          <option value="manchester">Manchester</option>
          <option value="birmingham">Birmingham</option>
          <option value="glasgow">Glasgow</option>
          <option value="edinburgh">Edinburgh</option>
          <option value="liverpool">Liverpool</option>
          <option value="leeds">Leeds</option>
          <option value="bristol">Bristol</option>
          <option value="newcastle">Newcastle</option>
        </select>
        <button id="filters-btn" class="filters-btn">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 2h12M3 7h8M5 12h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span id="filters-btn-label">Filters</span>
        </button>
      </div>
    </div>

    <div id="list-view" class="list-view">
      <div id="event-list" class="event-list"></div>
      <div id="no-results" class="no-results" hidden>
        <p>NO EVENTS FOUND</p>
        <span>Try changing your filters</span>
      </div>
    </div>
  </main>

  <!-- Filter Panel (full overlay) -->
  <div id="filter-panel" class="filter-panel" hidden>
    <div class="filter-panel-header">
      <span class="filter-panel-title">FILTERS</span>
      <button id="filters-close" class="filter-panel-close" aria-label="Close">&times;</button>
    </div>
    <div class="filter-section">
      <span class="filter-section-label">TYPE</span>
      <div class="filter-options" id="type-filters">
        <button class="filter-pill" data-filter="free">Free</button>
        <button class="filter-pill" data-filter="ticketed">Ticketed</button>
        <button class="filter-pill" data-filter="fan-zone">Fan Zones</button>
        <button class="filter-pill" data-filter="pub">Pubs</button>
        <button class="filter-pill" data-filter="outdoor">Outdoor</button>
        <button class="filter-pill" data-filter="rooftop">Rooftops</button>
      </div>
    </div>
    <div class="filter-section">
      <span class="filter-section-label">COUNTRY</span>
      <div class="filter-options" id="country-filters"></div>
    </div>
    <div class="filter-panel-actions">
      <button id="filters-clear" class="filter-action-btn clear">Clear all</button>
      <button id="filters-apply" class="filter-action-btn apply">Show results</button>
    </div>
  </div>

  <!-- Floating Map Button -->
  <button id="btn-open-map" class="floating-map-btn">
    <svg width="16" height="16" viewBox="0 0 18 18" fill="none"><path d="M9 1C5.7 1 3 3.7 3 7c0 4.5 6 10 6 10s6-5.5 6-10c0-3.3-2.7-6-6-6zm0 8.5c-1.4 0-2.5-1.1-2.5-2.5S7.6 4.5 9 4.5s2.5 1.1 2.5 2.5S10.4 9.5 9 9.5z" fill="currentColor"/></svg>
    Map
  </button>

  <!-- Full-Screen Map Mode -->
  <div id="map-mode" class="map-mode" hidden>
    <div id="map" class="map-fullscreen"></div>
    <button id="btn-close-map" class="map-back-btn">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      List
    </button>
    <div class="map-top-controls">
      <button id="map-today-toggle" class="map-today-btn">TODAY</button>
      <div class="map-legend map-legend-float">
        <span class="legend-item"><span class="legend-dot free"></span>Free</span>
        <span class="legend-item"><span class="legend-dot ticketed"></span>Ticketed</span>
      </div>
    </div>
    <button id="btn-locate-me" class="map-locate-btn" aria-label="Find my location">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="3" fill="currentColor"/><path d="M9 1v3M9 14v3M1 9h3M14 9h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
    <div id="map-card" class="map-card" hidden></div>
  </div>

  <!-- Cookie Consent Banner -->
  <div id="cookie-banner" class="cookie-banner" hidden>
    <div class="cookie-inner">
      <p class="cookie-text">Allow cookies to save your favourites between visits?</p>
      <div class="cookie-actions">
        <button id="cookie-accept" class="cookie-btn accept">Accept</button>
        <button id="cookie-decline" class="cookie-btn decline">No thanks</button>
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="upcoming">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="2" y="3" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M2 7h16" stroke="currentColor" stroke-width="1.5"/><path d="M6 1v4M14 1v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>Upcoming</span>
    </button>
    <button class="nav-item" data-tab="fixtures">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/><path d="M10 5v5l3.5 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Fixtures</span>
    </button>
    <button class="nav-item" data-tab="favourites">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 17s-7-4.35-7-8.5C3 5.46 5.46 3 8 3c1.4 0 2.6.7 3.4 1.7L10 6l-1.4-1.3C9.4 3.7 10.6 3 12 3c2.54 0 5 2.46 5 5.5 0 4.15-7 8.5-7 8.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <span>Favourites</span>
    </button>
  </nav>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
